# slam_toolbox, online asynchronous mode. LEVEL 2: build the map.
#
# "Online" means it runs live rather than from a bag; "asynchronous" means it
# processes the most recent scan and drops the backlog instead of queueing,
# which is what you want on a machine that cannot keep up in real time.
#
# The frames must match the robot: odom comes from diff_drive_controller,
# base_footprint is the frame odometry is reported for, and the scan arrives in
# laser_link. slam_toolbox publishes map -> odom; nothing else may.

slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # --- plugins ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- frames and topics ---
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping                 # localization for LEVEL 3 off a saved pose graph

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0

    # LDROBOT D500 reaches 12 m, but the useful range for scan matching indoors
    # is shorter: far returns are noisy and hit walls at a glancing angle.
    resolution: 0.05
    max_laser_range: 10.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # --- scan matching ---
    use_scan_matching: true
    use_scan_barycenter: true
    # Add a scan every 0.2 m or 0.25 rad. Tighter gives a denser pose graph and
    # a better map at the cost of CPU; looser drifts.
    # How far the robot must move before a scan is matched at all. These
    # are the reason a correction takes "a few seconds to overlap": at 0.25 rad
    # the pose was only revisited after 14 deg of turn, so between updates the
    # scan rides on raw odometry and visibly lags the map.
    #
    # 0.1 rad is 5.7 deg, roughly 2.5x more corrections, which is affordable:
    # matching is on the laptop, not the Nano, and the lidar is a clean 10 Hz.
    # Raise them again if the CPU cannot keep up - a matcher that falls behind
    # is worse than one that runs less often.
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    # OFF deliberately. Loop closure exists to snap out accumulated drift
    # when a long traverse returns somewhere already mapped. This room is
    # 5.2 x 4.05 m - most of it is inside lidar range from anywhere in it, so
    # continuous scan matching already keeps the pose registered and there is
    # no drift left for loop closure to remove.
    #
    # What it does bring is risk. It is the ONLY mechanism in slam_toolbox that
    # can move the pose discontinuously, and a rectangular room matches itself
    # well when rotated by 90 deg - especially a partial view from near a
    # corner. loop_search_space_dimension is 8.0 m, wider than the room itself,
    # and loop_match_minimum_response_fine of 0.45 is permissive. That is the
    # single 90 deg snap seen once in four runs, which is exactly the size and
    # the suddenness a bad loop closure produces.
    #
    # Turn this back ON before mapping anything with corridors or a space too
    # large to see across, and raise loop_match_minimum_response_fine to ~0.6
    # and loop_match_minimum_chain_size to ~15 when you do.
    do_loop_closing: false
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # --- correlation search windows ---
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # --- scan matcher penalties ---
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
